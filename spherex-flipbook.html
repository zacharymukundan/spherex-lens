<html lang="en">
<head>

<title>SPHEREx Sky Flipbook</title>

<style>

.left,.side{display:flex;min-height:0;min-width:0;flex-direction:column}
.left{width:var(--s,300px);justify-self:end}

.bottom{flex:1;min-height:150px;display:flex;gap:10px}
.card.grow{flex:1;min-width:0;padding:6px;display:flex}
.ovcard{flex:none;padding:0;background:var(--sky);overflow:hidden}
